<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1038"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Золотой кликер</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--b1:#1b1038;--b2:#08203d;--tx:#f5f1ff;--mut:#a9a2cf;--ac:#ffc83d;--card:rgba(255,255,255,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{height:100%;background:#0b1630;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--b1),var(--b2));color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;overflow:hidden}
header{text-align:center;padding:14px 12px 4px}
#sc{font-size:clamp(36px,12vw,56px);font-weight:800;color:var(--ac);text-shadow:0 0 24px rgba(255,200,61,.45);line-height:1.1}
#ps{color:var(--mut);font-size:15px;margin-top:2px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#big{width:min(66vw,38vh);aspect-ratio:1;border:0;background:none;display:flex;align-items:center;justify-content:center;transition:transform .08s,filter .08s;animation:pulse 2.2s ease-in-out infinite;cursor:pointer;padding:0;filter:drop-shadow(0 0 22px rgba(255,200,61,.55))}
#big img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
img{-webkit-user-drag:none}
#big.pr{transform:scale(.92);animation:none;filter:drop-shadow(0 0 40px rgba(255,200,61,.95)) brightness(1.1)}
@keyframes pulse{50%{transform:scale(1.04)}}
.fl{position:fixed;font-weight:800;font-size:24px;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none;z-index:9;animation:up .8s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes up{to{transform:translate(-50%,-140px);opacity:0}}
#pres{position:absolute;right:12px;top:6px;background:linear-gradient(90deg,#8b5cf6,#ec4899);color:#fff;border:0;border-radius:14px;padding:10px 14px;font-size:15px;font-weight:700;display:none;animation:pulse 1.5s infinite}
#panel{height:44%;display:flex;flex-direction:column;background:rgba(0,0,0,.3);border-radius:22px 22px 0 0}
#tabs{display:flex;gap:6px;padding:10px 10px 6px}
#tabs button{flex:1;padding:12px 1px;border:0;border-radius:12px;background:var(--card);color:var(--mut);font-size:12px;font-weight:600}
#tabs button.on{background:var(--ac);color:#2a1a00}
#list{flex:1;overflow-y:auto;padding:4px 10px 12px;-webkit-overflow-scrolling:touch}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:8px 8px 8px 12px;margin-bottom:8px}
.it .e img{width:46px;height:46px;display:block;object-fit:contain}.ps img{width:20px;height:20px;vertical-align:-4px;margin-right:4px}.it .i{flex:1;min-width:0}.it .n{font-weight:700;font-size:15px}.it .d{color:var(--mut);font-size:13px}
.it button{min-width:92px;min-height:48px;border:0;border-radius:12px;background:#22c55e;color:#04210f;font-weight:800;font-size:14px}
.it button.dis{background:#3b3558;color:#8b84b3}
.row{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
.row b{color:var(--ac)}
#rs{width:100%;margin-top:14px;min-height:48px;border:0;border-radius:12px;background:#7f1d1d;color:#fff;font-weight:700;font-size:15px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:#fff;color:#1b1038;padding:12px 18px;border-radius:14px;font-weight:700;z-index:20;display:none;max-width:90%;text-align:center}
header{position:relative}
.hb{position:absolute;top:10px;width:44px;height:44px;border:0;border-radius:50%;background:var(--card);font-size:22px;padding:0;color:var(--tx)}
#gift{animation:pulse 1.4s infinite}
#qt{display:flex;gap:6px;margin-bottom:8px}#qt button{flex:1;min-height:40px;border:0;border-radius:10px;background:var(--card);color:var(--mut);font-weight:700}#qt button.on{background:var(--ac);color:#2a1a00}
.it.lk{opacity:.45}.am{font-size:30px;width:46px;text-align:center}.am2{font-size:22px;padding-right:8px}
.gold{position:absolute;left:-90px;width:74px;height:74px;border:0;background:none;padding:0;filter:drop-shadow(0 0 16px #fff) saturate(1.5);animation:fly 6s linear forwards;z-index:5}
.gold img{width:100%;height:100%;animation:wob .5s infinite alternate;pointer-events:none}
@keyframes fly{to{left:100%}}@keyframes wob{to{transform:rotate(14deg) scale(1.12)}}
#md{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.mb{background:#241a4a;border-radius:18px;padding:20px;max-width:340px;width:100%;text-align:center;font-size:16px;line-height:1.4}
.mr{display:flex;gap:10px;margin-top:16px}.mr button{flex:1;min-height:48px;border:0;border-radius:12px;font-weight:700;font-size:15px;background:#3b3558;color:#fff}.mr #my{background:#8b5cf6}
input{-webkit-user-select:text;user-select:text}
#nk{display:flex;gap:8px;margin-bottom:8px}#nk input{flex:1;min-height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--tx);padding:0 12px;font-size:16px}#nk button{min-height:46px;padding:0 14px;border:0;border-radius:12px;background:var(--ac);color:#2a1a00;font-weight:800}
#nt{color:var(--mut);font-size:13px;margin-bottom:6px}
</style></head><body>
<header><button id="gift" class="hb" style="left:12px;display:none">🎁</button><button id="snd" class="hb" style="right:12px">🔊</button><div id="sc">0</div><div id="ps"></div></header>
<div id="stage"><button id="big" aria-label="Клик"></button><button id="pres"></button></div>
<div id="panel"><div id="tabs"></div><div id="list"></div></div>
<div id="toast"></div><div id="md"><div class="mb"><div id="mt"></div><div class="mr"><button id="my">Да</button><button id="mn">Отмена</button></div></div></div>

[["🔥","Огненный кулак"],["🔴","Лазер"],["☢️","Плазменный удар"],["🌀","Гравитационный удар"],["⚔️","Звёздный меч"],["💥","Удар сверхновой"],["🧿","Разрыв пространства"],["🕰️","Рука времени"],["🌈","Сила творения"],["📜","Слово Создателя"],["👑","Палец Бога"]].forEach((x,k)=>{const n=k+1,r=v=>+v.toPrecision(2);C.push([x[0],x[1],r(5e5*231**n),r(1e3*285**n)])});
const M=[["📈","Доход +10%",2000,.1],["📊","Доход +25%",2e4,.25],["💹","Доход +50%",2e5,.5],["💎","Доход +100%",2e6,1]];
const def=()=>({pts:0,run:0,all:0,clicks:0,own:Array(P.length).fill(0),c:Array(C.length).fill(0),m:Array(4).fill(0),stars:0,time:0,ach:[],dl:'',st:0,snd:1,win:0,nick:'',uid:'',last:Date.now()});
let S=def();
try{const r=JSON.parse(localStorage.getItem(KEY));if(r)S=Object.assign(def(),r)}catch(e){}
while(S.own.length<P.length)S.own.push(0);while(S.c.length<C.length)S.c.push(0);if(!S.uid)S.uid=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const $=id=>document.getElementById(id);
const U=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg'];
function fmt(n){if(n<1000)return n<10&&n%1?(+n.toFixed(1))+'':Math.floor(n)+'';if(n>=1e66)return '999Vg';let i=Math.min(21,Math.floor(Math.log10(n)/3)),v=n/1000**i;return v.toFixed(v<10?2:v<100?1:0)+U[i]}
function tm(s){s=Math.floor(s);return Math.floor(s/3600)+'ч '+Math.floor(s%3600/60)+'м '+s%60+'с'}
let buff=0;const bf=()=>Date.now()<buff?7:1;
const pm=()=>(1+M.reduce((a,m,i)=>a+(S.m[i]?m[3]:0),0))*(1+S.stars)*(1+.02*S.ach.length)*bf();
const cps=()=>P.reduce((a,p,i)=>a+S.own[i]*p[3],0)*pm();
const cp=()=>(1+C.reduce((a,c,i)=>a+(S.c[i]?c[3]:0),0))*(1+S.stars)*bf();
let tab=0,els=[],qty=1;
const T=["Доход","Клик","Бонусы","Цели","Стат.","Топ"];
function items(t){
 if(t==0)return P.map((p,i)=>({e:img(i<8?i+1:i+11),n:p[1],d:()=>'+'+fmt(p[3]*pm())+'/с · есть: '+S.own[i],c:()=>tot(i,nOf(i)),q:()=>nOf(i)>1?'×'+nOf(i)+' ':'',buy(){S.own[i]+=nOf(i)}}));
 if(t==1)return C.map((p,i)=>({e:img(i<5?i+9:i+22),n:p[1],d:()=>'+'+fmt(p[3]*(1+S.stars))+' за клик',c:()=>p[2],done:()=>S.c[i],buy(){S.c[i]=1}}));
 return M.map((p,i)=>({e:img(i+14),n:p[1],d:()=>'Множит весь пассивный доход',c:()=>p[2],done:()=>S.m[i],buy(){S.m[i]=1}}));
}
function tabs(){$('tabs').innerHTML=T.map((n,i)=>`<button data-t="${i}" class="${i==tab?'on':''}">${n}</button>`).join('')}
$('tabs').onclick=e=>{const t=e.target.dataset.t;if(t!=null){tab=+t;tabs();render()}};
function render(){
 const L=$('list');els=[];
 if(tab==5){L.innerHTML='<div id="nk"><input id="ni" maxlength="14" placeholder="Ваш ник" autocomplete="off"><button id="ns">Сохранить</button></div><div id="nt"></div><div id="tb"></div>';$('ni').value=S.nick||'';$('ns').onclick=()=>{S.nick=$('ni').value.trim().slice(0,14);save();pushTop(1);toast(S.nick?'Ник сохранён':'Введите ник')};$('nt').textContent=TOP_URL?'Рейтинг по всему заработанному. Результат обновляется сам.':'';drawTop();loadTop();pushTop();return}
 if(tab==3){const n=S.ach.length;L.innerHTML=`<div class="row"><span>Открыто ${n} из ${AC.length}</span><b>+${n*2}% к доходу</b></div>`+AC.map((a,i)=>{const d=S.ach.includes(i);return `<div class="it ${d?'':'lk'}"><div class="e am">${a[0]}</div><div class="i"><div class="n">${a[1]}</div><div class="d">${d?'Получено · +2% к доходу':'Пока закрыто'}</div></div><div class="am2">${d?'🏆':'🔒'}</div></div>`}).join('');return}
 if(tab==4){L.innerHTML='<div id="st"></div><button id="rs">Полный сброс</button>';$('rs').onclick=()=>ask('Удалить весь прогресс, включая звёзды?',()=>{S=def();S.uid=Math.random().toString(36).slice(2,10)+Date.now().toString(36);save();render();ui()});ui();return}
 L.innerHTML='';
 if(tab==0){const q=document.createElement('div');q.id='qt';q.innerHTML=['1','10','max'].map(v=>`<button data-q="${v}" class="${String(qty)==v?'on':''}">${v=='max'?'MAX':'×'+v}</button>`).join('');q.onclick=e=>{const v=e.target.dataset.q;if(v){qty=v=='max'?'max':+v;[...q.children].forEach(c=>c.classList.toggle('on',c.dataset.q==String(qty)));ui()}};L.appendChild(q)}
 items(tab).forEach(o=>{
  const d=document.createElement('div');d.className='it';
  d.innerHTML=`<div class="e">${o.e}</div><div class="i"><div class="n">${o.n}</div><div class="d"></div></div><button></button>`;
  const b=d.querySelector('button'),ds=d.querySelector('.d');
  b.onclick=()=>{if(o.done&&o.done())return;const c=o.c();if(S.pts>=c){o.buy();S.pts-=c;beep(1);ui()}};
  o.upd=()=>{const dn=o.done&&o.done(),c=o.c();ds.textContent=o.d();b.innerHTML=dn?'✔ Куплено':'<span class="ps">'+img(0)+'</span>'+(o.q?o.q():'')+fmt(c);b.className=(dn||S.pts<c)?'dis':''};
  L.appendChild(d);els.push(o);
 });
 ui();
}
function ui(){
 $('sc').textContent=fmt(Math.floor(S.pts));
 $('ps').textContent=fmt(cps())+' в секунду · за клик +'+fmt(cp())+(S.stars?' · ⭐'+S.stars:'')+(Date.now()<buff?' · ✨×7 '+Math.ceil((buff-Date.now())/1000)+'с':'');
 $('gift').style.display=S.dl!==new Date().toDateString()?'block':'none';
 $('pres').style.display=S.run>=1e6?'block':'none';
 if(tab==4){const r=[['Всего кликов',fmt(S.clicks)],['Всего заработано',fmt(S.all)],['Доход в секунду',fmt(cps())],['Множитель клика','×'+fmt(cp())],['Множитель дохода','×'+pm().toFixed(2)],['Звёзды','⭐ '+S.stars],['Время в игре',tm(S.time)],['Финал игры',S.win?'🎉 пройден':'купить Источник всего и Палец Бога']];
  $('st').innerHTML=r.map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}
 else els.forEach(o=>o.upd());
}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4000)}
function tick(){
 const n=Date.now();let dt=Math.max(0,(n-S.last)/1000);S.last=n;let g;
 if(dt>3){dt=Math.min(dt,604800);g=cps()*dt*.5;if(g>0)toast('😴 Пока вас не было: +'+fmt(g)+' 💰')}
 else{g=cps()*dt;S.time+=dt}
 S.pts+=g;S.run+=g;S.all+=g;if(++tc%10==0)chk();ui();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function hit(x,y){
 const p=cp();S.pts+=p;S.run+=p;S.all+=p;S.clicks++;beep(0);if(S.snd&&navigator.vibrate)navigator.vibrate(6);
 const f=document.createElement('div');f.className='fl';f.textContent='+'+fmt(p);f.style.left=x+(Math.random()*40-20)+'px';f.style.top=y-30+'px';
 document.body.appendChild(f);setTimeout(()=>f.remove(),800);ui();
}
function big_init(){$('big').innerHTML=img(0);$('pres').innerHTML='<span class="ps">'+img(18)+'</span>Престиж'}
const big=$('big'),rel=()=>big.classList.remove('pr');
big.addEventListener('touchstart',e=>{e.preventDefault();big.classList.add('pr');for(const t of e.changedTouches)hit(t.clientX,t.clientY)},{passive:false});
['touchend','touchcancel','mouseup','mouseleave'].forEach(v=>big.addEventListener(v,rel));
big.addEventListener('mousedown',e=>{big.classList.add('pr');hit(e.clientX,e.clientY)});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
function ask(t,f){$('my').textContent='Да';$('mn').style.display='';$('mt').textContent=t;$('md').style.display='flex';$('my').onclick=()=>{$('md').style.display='none';f()};$('mn').onclick=()=>$('md').style.display='none'}
$('pres').onclick=()=>{if(S.run>=1e6)ask('Престиж: сбросить прогресс и получить ⭐ (+100% к клику и доходу навсегда)?',doPres)};
function doPres(){
 if(S.run<1e6)return;
 const k=S.clicks,a=S.all,t=S.time,s=S.stars+1;
 const o=S;S=def();S.clicks=k;S.all=a;S.time=t;S.stars=s;S.ach=o.ach;S.dl=o.dl;S.st=o.st;S.snd=o.snd;S.win=o.win;S.nick=o.nick;S.uid=o.uid;save();render();toast('⭐ Новая звезда! Всего: '+s);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){tick();save()}else tick()});
addEventListener('pagehide',()=>{S.last=Date.now();save()});
addEventListener('beforeunload',()=>{S.last=Date.now();save()});
setInterval(save,5000);
let tc=0,ac;
const AC=[["👆","100 кликов",()=>S.clicks>=100],["👆","1 000 кликов",()=>S.clicks>=1e3],["✊","10 000 кликов",()=>S.clicks>=1e4],["💰","Заработать 10K",()=>S.all>=1e4],["💰","Заработать 1M",()=>S.all>=1e6],["💎","Заработать 1B",()=>S.all>=1e9],["🌌","Заработать 1T",()=>S.all>=1e12],["🕳️","Заработать 1Qa",()=>S.all>=1e15],["👁️","Заработать 1No",()=>S.all>=1e30],["🕳️","Купить чёрную дыру",()=>S.own[9]>0],["🏪","25 построек",()=>S.own.reduce((a,b)=>a+b,0)>=25],["🏭","100 построек",()=>S.own.reduce((a,b)=>a+b,0)>=100],["⭐","Первая звезда",()=>S.stars>=1],["🌟","5 звёзд",()=>S.stars>=5],["⚡","Доход 1K/с",()=>cps()>=1e3],["🚀","Доход 1M/с",()=>cps()>=1e6]];
const tot=(i,n)=>P[i][2]*1.15**S.own[i]*(1.15**n-1)/.15;
const nOf=i=>{if(qty!=='max')return qty;let n=0;while(n<500&&tot(i,n+1)<=S.pts)n++;return Math.max(n,1)};
function win(){$('mt').innerHTML='🎉 <b>Игра пройдена!</b><br>Вы купили «Источник всего» и «Палец Бога».<br>Время в игре: '+tm(S.time)+' · звёзд: '+S.stars+'<br>Спасибо, что дошли до конца!';$('my').textContent='Играть дальше';$('mn').style.display='none';$('md').style.display='flex';$('my').onclick=()=>{$('md').style.display='none';$('my').textContent='Да';$('mn').style.display=''}}
const TOP_URL='https://golden-clicker-default-rtdb.firebaseio.com';
let TOP=[],lastPush=0;
function pushTop(f){if(!TOP_URL||!S.nick)return;const n=Date.now();if(!f&&n-lastPush<30000)return;lastPush=n;fetch(TOP_URL+'/tops/'+S.uid+'.json',{method:'PUT',body:JSON.stringify({nick:S.nick,all:S.all,stars:S.stars,win:S.win,t:Math.floor(S.time)})}).catch(()=>{})}
async function loadTop(){if(!TOP_URL)return;try{const r=await fetch(TOP_URL+'/tops.json?orderBy="all"&limitToLast=20'),o=await r.json()||{};TOP=Object.entries(o).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>b.all-a.all);drawTop()}catch(e){}}
function drawTop(){const b=$('tb');if(!b)return;b.innerHTML='';
 if(!TOP_URL){b.textContent='Топ ещё не подключён к базе.';return}
 if(!TOP.length){b.textContent='Пока никого. Введите ник, и вы станете первым.';return}
 TOP.forEach((r,i)=>{const d=document.createElement('div');d.className='row';const a=document.createElement('span');a.textContent=(['🥇','🥈','🥉'][i]||(i+1)+'.')+' '+String(r.nick||'Игрок').slice(0,14)+(r.id===S.uid?' (вы)':'')+(r.win?' 🎉':'');const v=document.createElement('b');v.textContent=fmt(+r.all||0)+(r.stars?' ⭐'+r.stars:'');d.append(a,v);b.appendChild(d)})}
setInterval(()=>{if(tab==5)loadTop()},15000);
function chk(){pushTop();if(!S.win&&S.own[15]>0&&S.c[15]){S.win=1;beep(3);save();win()}AC.forEach((a,i)=>{if(!S.ach.includes(i)&&a[2]()){S.ach.push(i);toast('🏆 '+a[1]+'! +2% к доходу');beep(3);if(tab==3)render()}})}
function beep(k){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),f=[620,880,1100,1400][k],t=ac.currentTime;o.connect(g);g.connect(ac.destination);o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.6,t+.08);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.start(t);o.stop(t+.13)}catch(e){}}
$('snd').onclick=()=>{S.snd=S.snd?0:1;$('snd').textContent=S.snd?'🔊':'🔇';beep(1)};
$('gift').onclick=()=>{const td=new Date().toDateString();if(S.dl===td)return;S.st=S.dl===new Date(Date.now()-864e5).toDateString()?Math.min(S.st+1,7):1;S.dl=td;const r=(200+cps()*300)*S.st;S.pts+=r;S.run+=r;S.all+=r;beep(2);toast('🎁 День '+S.st+' подряд: +'+fmt(r));save();ui()};
function gold(){const g=document.createElement('button');g.className='gold';g.innerHTML=img(0);g.style.top=(10+Math.random()*55)+'%';
 g.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();buff=Date.now()+30000;g.remove();beep(2);if(S.snd&&navigator.vibrate)navigator.vibrate(30);toast('✨ Доход и клик ×7 на 30 секунд!')});
 g.addEventListener('animationend',()=>g.remove());$('stage').appendChild(g)}
(function sched(){setTimeout(()=>{if(!document.hidden)gold();sched()},30000+Math.random()*40000)})();
$('snd').textContent=S.snd?'🔊':'🔇';
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
big_init();tabs();render();tick();
setInterval(tick,100);
</script></body></html>
